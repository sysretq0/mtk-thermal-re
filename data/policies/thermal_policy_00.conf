[policy_type]
# If permanent= Yes, this policy is still valid after reboot
permanent= No

[LTF]
thermal_zone= soc_max
mode= enabled

[mtk-skin-control]
sensor= ap_ntc
max_target_tj= 85000
min_target_tj= 55000
trip_tpcb= 43000
target_tpcb= 46000

[charger-cooler]
mode= enabled
sensor= ap_ntc
threshold= [40000, 42000, 45000, 56000]
hysteresis= [2000, 2000, 2000, 2000]
current= [1800, 1000, 500, 0]

[mutt-pa1-cooler]
mode= enabled
sensor= ltepa_ntc
threshold= [70000, 73000]
hysteresis= [2000, 2000]
limit-state= [1, 2]

[thermalhal-threshold]
type= SKIN
sensor= ap_ntc
level= [severe, critical, emergency, shutdown]
threshold= [47000, 56000, 58000, 80000]