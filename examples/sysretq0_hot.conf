[policy_type]
# =============================================================================
#   sysretq0  ::  thermal profile  "HOT"
# -----------------------------------------------------------------------------
#   Runs HOT: the throttle targets are raised to the hottest values the vendor
#   itself ships (its thermal_policy_08 / thermal_mtbf profile), so the device
#   holds high clocks much longer while staying inside the supported envelope.
#
#   SAFE ENVELOPE - kept intact; the hard rails never move:
#     * junction clamp    max_target_tj = 85000 (85.0 C)   unchanged
#     * HAL shutdown          threshold = 80000 (80.0 C)   unchanged
#     * charge-current limits                              unchanged
#     * backlight cooling limits                           unchanged
#     * HW protection (set_hw_reboot)                  enabled (not disabled)
#
#   WHAT MOVES (stock thermal.conf -> sysretq0 HOT), a uniform +5.0 C:
#     * target_tpcb     46000 -> 51000
#     * trip_tpcb       43000 -> 48000
#     * min_target_tj   55000 -> 60000
#     * HAL severe      47000 -> 52000   (critical/emergency/shutdown unchanged)
#
#   These are the vendor's own hottest shipped values - deliberately not
#   beyond them.  Roll back any time with:   thermal_intf apply thermal.conf
# =============================================================================
#
# If permanent= Yes, this policy is still valid after reboot
permanent= Yes

[LTF]
thermal_zone= soc_max
mode= enabled

[mtk-skin-control]
# sysretq0: +5.0 C on the PCB/junction targets (vendor hot-profile values)
sensor= ap_ntc
max_target_tj= 85000
min_target_tj= 60000
trip_tpcb= 48000
target_tpcb= 51000


[charger-cooler]
# sysretq0: unchanged - battery / charge heat protection
mode= enabled
sensor= ap_ntc
threshold= [43000, 46000, 49000, 52000, 56000]
hysteresis= [2000, 2000, 2000, 2000, 2000]
current= [3000, 3000, 3000, 3000, 1000]

[mutt-pa1-cooler]
# sysretq0: unchanged - modem PA protection
mode= enabled
sensor= ltepa_ntc
threshold= [70000, 73000]
hysteresis= [2000, 2000]
limit-state= [1, 2]

[thermalhal-threshold]
# sysretq0: severe raised to 52000; critical/emergency/shutdown unchanged
type= SKIN
sensor= ap_ntc
level= [severe, critical, emergency, shutdown]
threshold= [52000, 56000, 58000, 80000]

[backlight-cooler]
# sysretq0: unchanged - display still cools the skin
mode= enabled
sensor= ap_ntc
threshold= [36000, 41000, 43000, 54000, 57000]
hysteresis= [2000, 2000, 2000, 2000, 2000]
reduce-brightness= [0, 30, 40, 40, 40]
